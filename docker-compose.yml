version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zuard-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOCAL_PRIVACY_MODE=true
    volumes:
      - ./backend/vault/projects:/app/vault/projects
      - ./docs:/docs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: zuard-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
